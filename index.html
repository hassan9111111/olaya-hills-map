<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مخطط العليا هيلز التفاعلي</title>
<link rel="preload" as="image" href="map-background-optimized.webp" type="image/webp" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="stats-bar" id="stats-bar">
    <div class="stats-card" id="stat-blocks-available" data-filter="blocks-available">
      <span class="stats-dot dot-available"></span>
      <span class="stats-text">بلوكات متاحة: <b id="count-blocks-available">0</b></span>
    </div>
    <div class="stats-card" id="stat-blocks-sold" data-filter="blocks-sold">
      <span class="stats-dot dot-sold"></span>
      <span class="stats-text">بلوكات مباعة: <b id="count-blocks-sold">0</b></span>
    </div>
    <div class="stats-card" id="stat-plots-available" data-filter="plots-available">
      <span class="stats-dot dot-available"></span>
      <span class="stats-text">قطع متاحة (بيع بالقطعة): <b id="count-plots-available">0</b></span>
    </div>
  </div>

  <div class="search-bar" id="search-bar">
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="ابحث برقم القطعة، أو رقم البلوك، أو اسم المرفق..."
        autocomplete="off"
        inputmode="search"
      />
      <button id="search-clear" class="search-clear" aria-label="مسح" hidden>✕</button>
    </div>
    <ul id="search-results" class="search-results" hidden></ul>
  </div>

  <div class="map-container" id="map-container">
    <div class="map-hint" id="map-hint">اضغط على أي قطعة أو بلوك لعرض التفاصيل</div>
    <div class="filter-label" id="filter-label"></div>
    <div class="map-legend" id="map-legend">
      <div class="legend-item"><span class="legend-swatch swatch-residential"></span>سكني</div>
      <div class="legend-item"><span class="legend-swatch swatch-commercial"></span>تجاري</div>
      <div class="legend-item"><span class="legend-swatch swatch-available"></span>متاح</div>
      <div class="legend-item"><span class="legend-swatch swatch-sold"></span>مباع</div>
      <div class="legend-item"><span class="legend-swatch swatch-by-plot"></span>يُباع بالقطعة</div>
    </div>
    <picture>
      <source srcset="map-background-optimized.webp" type="image/webp" />
      <img class="bg-image" src="map-background-optimized.jpg" alt="مخطط العليا هيلز" draggable="false" fetchpriority="high" />
    </picture>
    <svg class="overlay" id="overlay" viewBox="0 0 1360.63 1345" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Cinematic "out of focus" look: heavily desaturated + slightly
             darkened, NOT hidden. The map stays visually "alive" outside
             the current filter's focus instead of looking switched off. -->
        <filter id="focus-dim-filter" x="-5%" y="-5%" width="110%" height="110%">
          <feColorMatrix type="saturate" values="0.12" />
          <feComponentTransfer>
            <feFuncR type="linear" slope="0.88" intercept="0.03" />
            <feFuncG type="linear" slope="0.88" intercept="0.03" />
            <feFuncB type="linear" slope="0.88" intercept="0.03" />
          </feComponentTransfer>
        </filter>
        <clipPath id="focus-dim-clip" clipPathUnits="userSpaceOnUse"></clipPath>
      </defs>
      <!-- A second copy of the exact same background, desaturated, shown
           ONLY inside the current filter's "not the focus" shapes (via the
           clip path above). Sits above the normal full-color background
           but below every interactive layer, so clicking is unaffected. -->
      <image
        id="focus-dim-image"
        href="map-background-optimized.webp"
        x="0" y="0" width="1360.63" height="1345"
        preserveAspectRatio="none"
        filter="url(#focus-dim-filter)"
        clip-path="url(#focus-dim-clip)"
      ></image>
      <!-- Layers are intentionally separate and independent, so future
           features (status colors, filters, search highlight...) can target
           one layer without touching the others. Order = stacking order. -->
      <g id="block-outlines-layer"></g>
      <g id="facilities-layer"></g>
      <g id="plots-layer"></g>
      <g id="status-overlay-layer"></g>
      <g id="filter-overlay-layer"></g>
      <g id="badges-layer"></g>
    </svg>
  </div>

  <div class="version-label">v1.0</div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="إغلاق">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
